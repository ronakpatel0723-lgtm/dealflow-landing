<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glow1" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="rgba(79,124,255,0.25)"/>
      <stop offset="100%" stop-color="rgba(4,6,13,0)"/>
    </radialGradient>
    <radialGradient id="glow2" cx="85%" cy="80%" r="50%">
      <stop offset="0%" stop-color="rgba(54,211,153,0.12)"/>
      <stop offset="100%" stop-color="rgba(4,6,13,0)"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#04060D"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Fine grid -->
  <defs>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M 64 0 L 0 0 0 64" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Top accent line -->
  <rect x="0" y="0" width="1200" height="2" fill="url(#glow1)"/>

  <!-- Hexagon logo mark (top right) -->
  <g transform="translate(1100, 80)">
    <path d="M 40 10 L 70 27 L 70 61 L 40 78 L 10 61 L 10 27 Z" stroke="#5B8DEF" stroke-width="2" fill="none"/>
    <path d="M 40 24 L 57 33.5 L 57 52.5 L 40 62 L 23 52.5 L 23 33.5 Z" fill="rgba(91,141,239,0.2)" stroke="#5B8DEF" stroke-width="1.5"/>
  </g>

  <!-- Logo text -->
  <text x="100" y="100" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#F3F6FD" letter-spacing="-0.3">DealFlow</text>
  <text x="214" y="100" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#5B8DEF" letter-spacing="-0.3"> AI</text>

  <!-- Main stat -->
  <text x="100" y="280" font-family="'Courier New', 'IBM Plex Mono', ui-monospace, monospace" font-size="120" font-weight="700" fill="#5B8DEF" letter-spacing="-4" opacity="0.95">5.59×</text>

  <!-- Stat label -->
  <text x="103" y="330" font-family="'Courier New', 'IBM Plex Mono', ui-monospace, monospace" font-size="18" font-weight="500" fill="#9BA8C6" letter-spacing="2">SIGNAL-TO-NOISE  ·  WALK-FORWARD VALIDATED  ·  2020–2024</text>

  <!-- Divider line -->
  <rect x="100" y="370" width="1000" height="1" fill="rgba(255,255,255,0.08)"/>

  <!-- Subtitle -->
  <text x="100" y="420" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="600" fill="#F3F6FD" letter-spacing="-0.5">Acquisition intelligence for software M&amp;A</text>

  <!-- Sub-proof strip -->
  <text x="100" y="470" font-family="'Courier New', 'IBM Plex Mono', ui-monospace, monospace" font-size="15" fill="#5C6880" letter-spacing="0.5">203 verified deals  ·  29,800 company-years  ·  131 companies  ·  placebo 0.86×</text>

  <!-- Bottom CTA -->
  <rect x="100" y="530" width="220" height="50" rx="8" fill="#5B8DEF"/>
  <text x="210" y="561" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle">Request Access →</text>
</svg>
